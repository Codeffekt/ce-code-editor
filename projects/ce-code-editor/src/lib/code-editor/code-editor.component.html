<div class="code-editor d-flex flex-column">
  @if(!readonly) {
  <ce-code-editor-header [title]="title" (save)="onSave($event)"></ce-code-editor-header>
  } @else {
  <ce-code-editor-header [title]="title"></ce-code-editor-header>
  }
  <div id="size-handle" class="size-handle"></div>
  <ce-code-editor-content [code]="code" [config]="config" (codeChanges)="onCodeChange($event)"></ce-code-editor-content>
</div>
